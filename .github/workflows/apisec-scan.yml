name: API Security (Free)

on:
  push:
    branches: [ "Default" ]
  pull_request:
    branches: [ "Default" ]
  schedule:
    - cron: '43 2 * * 1'
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to scan (optional override)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  Trigger_ZAP_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve scan target
        id: target
        run: |
          target="${{ github.event.inputs.target_url }}"
          if [[ -z "$target" ]]; then
            target="${{ vars.ZAP_TARGET_URL || secrets.ZAP_TARGET_URL }}"
          fi
          if [[ -z "$target" ]]; then
            target="https://niknikovsky.github.io/openclaw-blog-thingy/"
          fi
          echo "url=$target" >> "$GITHUB_OUTPUT"

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@2b5fc7f98d837319798ab7f128ea50b7d40563b6 # v0.14.0
        with:
          target: ${{ steps.target.outputs.url }}
          fail_action: false
          cmd_options: '-a'
